name: Build WinDock Windows Executable & Installer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write # needed to publish GitHub Releases

env:
  VERSION: 1.0.${{ github.run_number }}

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore WinDock.csproj

    - name: Build & Publish Single-File Standalone Executable
      run: >
        dotnet publish WinDock.csproj
        -c Release
        -r win-x64
        --self-contained true
        -p:PublishSingleFile=true
        -p:IncludeNativeLibrariesForSelfExtract=true
        -p:Version=${{ env.VERSION }}
        -o ./publish

    - name: Compile Windows Installation Wizard (Inno Setup)
      run: |
        iscc /DMyAppVersion=${{ env.VERSION }} installer/WinDock_Setup.iss

    - name: Upload Installation Wizard (Setup.exe)
      uses: actions/upload-artifact@v4
      with:
        name: WinDock-Installation-Wizard
        path: ./publish/installer/WinDock-Setup.exe

    - name: Upload Standalone Portable WinDock.exe
      uses: actions/upload-artifact@v4
      with:
        name: WinDock-Standalone-Portable
        path: ./publish/WinDock.exe

    # Every successful build on main becomes a release; installed copies pick it up via UpdateService.
    - name: Publish GitHub Release
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ github.token }}
      run: >
        gh release create "v${{ env.VERSION }}"
        ./publish/installer/WinDock-Setup.exe
        ./publish/WinDock.exe
        --title "WinDock ${{ env.VERSION }}"
        --generate-notes
