name: Build WinDock Windows Executable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore WinDock.csproj

    - name: Build & Publish Single-File Standalone Executable
      run: >
        dotnet publish WinDock.csproj
        -c Release
        -r win-x64
        --self-contained true
        -p:PublishSingleFile=true
        -p:IncludeNativeLibrariesForSelfExtract=true
        -o ./publish

    - name: Upload WinDock.exe Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WinDock-Windows-x64
        path: ./publish/WinDock.exe
